name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: [self-hosted, Linux, X64, carshow, deploy-test]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        # npm ci skips optional platform binaries not in the lock file (npm/cli#4828).
        # npm install respects lock file versions and fills in missing platform deps.
        run: npm install

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: API tests
        run: npm test --workspace @carshow/api
