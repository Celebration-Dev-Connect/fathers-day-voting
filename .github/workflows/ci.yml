name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Build and test
    runs-on: [self-hosted, Linux, X64, carshow, deploy-test]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rollup Linux native binary
        # Lock file was generated on macOS; no resolved entry exists for the Linux
        # binary (npm/cli#4828). npm ci cannot install what's not in the lock file,
        # so install the exact matching version explicitly after the clean install.
        run: npm install --no-save "@rollup/rollup-linux-x64-gnu@4.60.4"

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: API tests
        run: npm test --workspace @carshow/api
