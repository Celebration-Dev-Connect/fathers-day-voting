name: Deploy Perf

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA to deploy to perf
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/reusable-app-deploy.yml
    with:
      environment: perf
      runner_labels: '["self-hosted","Linux","X64","carshow","deploy-test"]'
      commit_sha: ${{ inputs.commit_sha }}
