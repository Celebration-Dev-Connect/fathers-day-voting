name: Runner validation

on:
  workflow_dispatch:

jobs:
  validate:
    name: Validate self-hosted runner
    runs-on: [self-hosted, Linux, X64, carshow, deploy-test]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Print runner info
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $(uname -a)"
          node --version
          npm --version
          docker --version
          aws --version
          terraform --version || echo "terraform not installed"
