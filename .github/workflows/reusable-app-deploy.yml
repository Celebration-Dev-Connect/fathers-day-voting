name: Reusable App Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment name
        required: true
        type: string
      runner_labels:
        description: JSON array of runner labels
        required: true
        type: string
      commit_sha:
        description: Exact commit SHA to deploy
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    timeout-minutes: 45
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      PUBLIC_BUCKET: ${{ vars.PUBLIC_BUCKET }}
      ADMIN_BUCKET: ${{ vars.ADMIN_BUCKET }}
      JUDGE_BUCKET: ${{ vars.JUDGE_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      IMAGE_TAG: ${{ inputs.commit_sha }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Verify commit is on main
        run: |
          git merge-base --is-ancestor "$IMAGE_TAG" origin/main
          test "$(git rev-parse HEAD)" = "$IMAGE_TAG"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build and API tests
        run: |
          npm run build
          npm test --workspace @carshow/api

      - name: Configure AWS credentials with OIDC
        if: ${{ env.AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate deployment configuration
        run: ./infra/ci/deploy-app.sh validate

      - name: Build, deploy, and verify application
        run: ./infra/ci/deploy-app.sh deploy

      - name: Print rollout diagnostics on failure
        if: failure()
        run: ./infra/ci/deploy-app.sh diagnostics

      - name: Clean deployment workspace
        if: always()
        run: ./infra/ci/deploy-app.sh cleanup
