name: Reusable App Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment name
        required: true
        type: string
      runner_labels:
        description: JSON array of runner labels
        required: true
        type: string
      aws_region:
        description: AWS region
        required: true
        type: string
      ecs_cluster:
        description: ECS cluster name
        required: true
        type: string
      ecs_service:
        description: ECS service name
        required: true
        type: string
      public_bucket:
        description: Public SPA bucket
        required: true
        type: string
      admin_bucket:
        description: Admin SPA bucket
        required: true
        type: string
      judge_bucket:
        description: Judge SPA bucket
        required: true
        type: string
      cloudfront_distribution_id:
        description: CloudFront distribution ID
        required: true
        type: string
      public_url:
        description: Public application URL
        required: true
        type: string
      task_definition_template:
        description: Path to task definition template
        required: true
        type: string
    secrets:
      aws_role_arn:
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    runs-on: ${{ fromJson(inputs.runner_labels) }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ inputs.aws_region }}
      ECS_CLUSTER: ${{ inputs.ecs_cluster }}
      ECS_SERVICE: ${{ inputs.ecs_service }}
      PUBLIC_BUCKET: ${{ inputs.public_bucket }}
      ADMIN_BUCKET: ${{ inputs.admin_bucket }}
      JUDGE_BUCKET: ${{ inputs.judge_bucket }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ inputs.cloudfront_distribution_id }}
      PUBLIC_URL: ${{ inputs.public_url }}
      TASK_DEFINITION_TEMPLATE: ${{ inputs.task_definition_template }}
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Show deployment context
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Runner labels: ${{ inputs.runner_labels }}"
          echo "AWS region: $AWS_REGION"
          echo "ECS cluster: $ECS_CLUSTER"
          echo "ECS service: $ECS_SERVICE"
          echo "Image tag: $IMAGE_TAG"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build and tests
        run: |
          echo "TODO: replace with your real build/test commands"
          npm run build
          npm test --if-present

      - name: Validate unsafe startup flags are absent
        run: |
          if grep -R "CLEANUP_REGISTRATIONS_ON_START" .; then
            echo "CLEANUP_REGISTRATIONS_ON_START must not be present"
            exit 1
          fi
          if grep -R "RANDOMIZE_OWNER_CODES_ON_START" .; then
            echo "RANDOMIZE_OWNER_CODES_ON_START must not be present"
            exit 1
          fi
          if grep -R "RUN_SEED=true" .; then
            echo "RUN_SEED must be false"
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        if: ${{ secrets.aws_role_arn != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws_role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirm AWS identity
        run: |
          echo "TODO: requires AWS credentials"
          aws sts get-caller-identity

      - name: Log in to Amazon ECR
        run: |
          echo "TODO: add ECR login"

      - name: Build and push API image
        run: |
          echo "TODO: build and push carshow/api:${IMAGE_TAG}"

      - name: Render ECS task definition
        run: |
          echo "TODO: render task definition from ${TASK_DEFINITION_TEMPLATE}"
          mkdir -p infra/ci/out
          cp "${TASK_DEFINITION_TEMPLATE}" infra/ci/out/task-definition.rendered.json

      - name: Deploy ECS service
        run: |
          echo "TODO: register task definition and update ECS service"

      - name: Wait for ECS stability
        run: |
          echo "TODO: wait for ECS service stability"

      - name: Sync SPA assets
        run: |
          echo "TODO: build and sync public/admin/judge apps to S3"

      - name: Invalidate CloudFront
        run: |
          echo "TODO: invalidate distribution ${CLOUDFRONT_DISTRIBUTION_ID}"

      - name: Verify health endpoint
        run: |
          curl --fail --silent --show-error "${PUBLIC_URL}/api/health"

      - name: Print rollout diagnostics on failure
        if: failure()
        run: |
          echo "TODO: print ECS task failures, target health, and CloudWatch logs"
