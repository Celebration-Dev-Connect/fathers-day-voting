name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [test, perf, prod]
      action:
        description: Action to perform
        required: true
        type: choice
        options: [apply, destroy, suspend, resume]
      decommissioned:
        description: "Decommission (apply only): destroy backend, keep CloudFront + photos + static page"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    runs-on: [self-hosted, Linux, X64, carshow, deploy-test]
    environment: ${{ inputs.environment == 'prod' && 'infra-prod' || 'infra-nonprod' }}
    timeout-minutes: 60
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      AWS_REGION: ca-central-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Write tfvars from secrets
        env:
          # ── Test (infra-nonprod) ──────────────────────────────────────────
          TF_TEST_REGION:                ${{ secrets.TF_TEST_REGION }}
          TF_TEST_PROJECT:               ${{ secrets.TF_TEST_PROJECT }}
          TF_TEST_ENVIRONMENT:           ${{ secrets.TF_TEST_ENVIRONMENT }}
          TF_TEST_DOMAIN:                ${{ secrets.TF_TEST_DOMAIN }}
          TF_TEST_DB_USERNAME:           ${{ secrets.TF_TEST_DB_USERNAME }}
          TF_TEST_ROUTE53_ZONE_ID:       ${{ secrets.TF_TEST_ROUTE53_ZONE_ID }}
          TF_TEST_ECS_CPU:               ${{ secrets.TF_TEST_ECS_CPU }}
          TF_TEST_ECS_MEMORY:            ${{ secrets.TF_TEST_ECS_MEMORY }}
          TF_TEST_ECS_MIN_SIZE:          ${{ secrets.TF_TEST_ECS_MIN_SIZE }}
          TF_TEST_ECS_MAX_SIZE:          ${{ secrets.TF_TEST_ECS_MAX_SIZE }}
          TF_TEST_RDS_INSTANCE_CLASS:    ${{ secrets.TF_TEST_RDS_INSTANCE_CLASS }}
          TF_TEST_RDS_ALLOCATED_STORAGE: ${{ secrets.TF_TEST_RDS_ALLOCATED_STORAGE }}
          TF_TEST_RDS_BACKUP_RETENTION:  ${{ secrets.TF_TEST_RDS_BACKUP_RETENTION }}
          TF_TEST_ENABLE_DEV_LOGIN:      ${{ secrets.TF_TEST_ENABLE_DEV_LOGIN }}
          TF_TEST_RUN_SEED:              ${{ secrets.TF_TEST_RUN_SEED }}
          TF_TEST_TEARDOWN_FRIENDLY:     ${{ secrets.TF_TEST_TEARDOWN_FRIENDLY }}
          TF_TEST_IMAGE_TAG:             ${{ secrets.TF_TEST_IMAGE_TAG }}
          TF_TEST_PCO_CLIENT_ID:         ${{ secrets.TF_TEST_PCO_CLIENT_ID }}
          TF_TEST_PCO_CLIENT_SECRET:     ${{ secrets.TF_TEST_PCO_CLIENT_SECRET }}
          TF_TEST_PCO_API_APP_ID:        ${{ secrets.TF_TEST_PCO_API_APP_ID }}
          TF_TEST_PCO_API_SECRET:        ${{ secrets.TF_TEST_PCO_API_SECRET }}
          TF_TEST_PCO_CALLBACK_URL:      ${{ secrets.TF_TEST_PCO_CALLBACK_URL }}
          TF_TEST_PCO_TEAM_NAME:         ${{ secrets.TF_TEST_PCO_TEAM_NAME }}
          TF_TEST_ADMIN_WEB_URL:         ${{ secrets.TF_TEST_ADMIN_WEB_URL }}
          TF_TEST_JUDGE_WEB_URL:         ${{ secrets.TF_TEST_JUDGE_WEB_URL }}
          TF_TEST_WEBGUIDE_USERNAME:     ${{ secrets.TF_TEST_WEBGUIDE_USERNAME }}
          TF_TEST_WEBGUIDE_PASSWORD:     ${{ secrets.TF_TEST_WEBGUIDE_PASSWORD }}
          TF_TEST_EMAIL_SMTP_USERNAME:   ${{ secrets.TF_TEST_EMAIL_SMTP_USERNAME }}
          TF_TEST_EMAIL_SMTP_PASSWORD:   ${{ secrets.TF_TEST_EMAIL_SMTP_PASSWORD }}
          TF_TEST_EMAIL_FROM_ADDRESS:    ${{ secrets.TF_TEST_EMAIL_FROM_ADDRESS }}
          TF_TEST_OWNER_PORTAL_URL:      ${{ secrets.TF_TEST_OWNER_PORTAL_URL }}
          # ── Perf (infra-nonprod) ─────────────────────────────────────────
          TF_PERF_REGION:                ${{ secrets.TF_PERF_REGION }}
          TF_PERF_PROJECT:               ${{ secrets.TF_PERF_PROJECT }}
          TF_PERF_ENVIRONMENT:           ${{ secrets.TF_PERF_ENVIRONMENT }}
          TF_PERF_DOMAIN:                ${{ secrets.TF_PERF_DOMAIN }}
          TF_PERF_DB_USERNAME:           ${{ secrets.TF_PERF_DB_USERNAME }}
          TF_PERF_ROUTE53_ZONE_ID:       ${{ secrets.TF_PERF_ROUTE53_ZONE_ID }}
          TF_PERF_ECS_CPU:               ${{ secrets.TF_PERF_ECS_CPU }}
          TF_PERF_ECS_MEMORY:            ${{ secrets.TF_PERF_ECS_MEMORY }}
          TF_PERF_ECS_MIN_SIZE:          ${{ secrets.TF_PERF_ECS_MIN_SIZE }}
          TF_PERF_ECS_MAX_SIZE:          ${{ secrets.TF_PERF_ECS_MAX_SIZE }}
          TF_PERF_RDS_INSTANCE_CLASS:    ${{ secrets.TF_PERF_RDS_INSTANCE_CLASS }}
          TF_PERF_RDS_ALLOCATED_STORAGE: ${{ secrets.TF_PERF_RDS_ALLOCATED_STORAGE }}
          TF_PERF_RDS_BACKUP_RETENTION:  ${{ secrets.TF_PERF_RDS_BACKUP_RETENTION }}
          TF_PERF_DB_CONNECTION_LIMIT:   ${{ secrets.TF_PERF_DB_CONNECTION_LIMIT }}
          TF_PERF_SKIP_CLOUDFRONT:       ${{ secrets.TF_PERF_SKIP_CLOUDFRONT }}
          TF_PERF_CLOUDFRONT_CUSTOM_DOMAIN: ${{ secrets.TF_PERF_CLOUDFRONT_CUSTOM_DOMAIN }}
          TF_PERF_ENABLE_DEV_LOGIN:      ${{ secrets.TF_PERF_ENABLE_DEV_LOGIN }}
          TF_PERF_RUN_SEED:              ${{ secrets.TF_PERF_RUN_SEED }}
          TF_PERF_TEARDOWN_FRIENDLY:     ${{ secrets.TF_PERF_TEARDOWN_FRIENDLY }}
          TF_PERF_IMAGE_TAG:             ${{ secrets.TF_PERF_IMAGE_TAG }}
          TF_PERF_PCO_CLIENT_ID:         ${{ secrets.TF_PERF_PCO_CLIENT_ID }}
          TF_PERF_PCO_CLIENT_SECRET:     ${{ secrets.TF_PERF_PCO_CLIENT_SECRET }}
          TF_PERF_PCO_API_APP_ID:        ${{ secrets.TF_PERF_PCO_API_APP_ID }}
          TF_PERF_PCO_API_SECRET:        ${{ secrets.TF_PERF_PCO_API_SECRET }}
          TF_PERF_PCO_CALLBACK_URL:      ${{ secrets.TF_PERF_PCO_CALLBACK_URL }}
          TF_PERF_PCO_TEAM_NAME:         ${{ secrets.TF_PERF_PCO_TEAM_NAME }}
          TF_PERF_ADMIN_WEB_URL:         ${{ secrets.TF_PERF_ADMIN_WEB_URL }}
          TF_PERF_JUDGE_WEB_URL:         ${{ secrets.TF_PERF_JUDGE_WEB_URL }}
          TF_PERF_WEBGUIDE_USERNAME:     ${{ secrets.TF_PERF_WEBGUIDE_USERNAME }}
          TF_PERF_WEBGUIDE_PASSWORD:     ${{ secrets.TF_PERF_WEBGUIDE_PASSWORD }}
          TF_PERF_EMAIL_SMTP_USERNAME:   ${{ secrets.TF_PERF_EMAIL_SMTP_USERNAME }}
          TF_PERF_EMAIL_SMTP_PASSWORD:   ${{ secrets.TF_PERF_EMAIL_SMTP_PASSWORD }}
          TF_PERF_EMAIL_FROM_ADDRESS:    ${{ secrets.TF_PERF_EMAIL_FROM_ADDRESS }}
          TF_PERF_OWNER_PORTAL_URL:      ${{ secrets.TF_PERF_OWNER_PORTAL_URL }}
          # ── Prod (infra-prod) ────────────────────────────────────────────
          TF_PROD_REGION:                ${{ secrets.TF_PROD_REGION }}
          TF_PROD_PROJECT:               ${{ secrets.TF_PROD_PROJECT }}
          TF_PROD_ENVIRONMENT:           ${{ secrets.TF_PROD_ENVIRONMENT }}
          TF_PROD_DOMAIN:                ${{ secrets.TF_PROD_DOMAIN }}
          TF_PROD_DB_USERNAME:           ${{ secrets.TF_PROD_DB_USERNAME }}
          TF_PROD_ROUTE53_ZONE_ID:       ${{ secrets.TF_PROD_ROUTE53_ZONE_ID }}
          TF_PROD_ECS_CPU:               ${{ secrets.TF_PROD_ECS_CPU }}
          TF_PROD_ECS_MEMORY:            ${{ secrets.TF_PROD_ECS_MEMORY }}
          TF_PROD_ECS_MIN_SIZE:          ${{ secrets.TF_PROD_ECS_MIN_SIZE }}
          TF_PROD_ECS_MAX_SIZE:          ${{ secrets.TF_PROD_ECS_MAX_SIZE }}
          TF_PROD_RDS_INSTANCE_CLASS:    ${{ secrets.TF_PROD_RDS_INSTANCE_CLASS }}
          TF_PROD_RDS_ALLOCATED_STORAGE: ${{ secrets.TF_PROD_RDS_ALLOCATED_STORAGE }}
          TF_PROD_RDS_BACKUP_RETENTION:  ${{ secrets.TF_PROD_RDS_BACKUP_RETENTION }}
          TF_PROD_DB_CONNECTION_LIMIT:   ${{ secrets.TF_PROD_DB_CONNECTION_LIMIT }}
          TF_PROD_ENABLE_DEV_LOGIN:      ${{ secrets.TF_PROD_ENABLE_DEV_LOGIN }}
          TF_PROD_RUN_SEED:              ${{ secrets.TF_PROD_RUN_SEED }}
          TF_PROD_TEARDOWN_FRIENDLY:     ${{ secrets.TF_PROD_TEARDOWN_FRIENDLY }}
          TF_PROD_CORS_ALLOWED_ORIGINS:  ${{ secrets.TF_PROD_CORS_ALLOWED_ORIGINS }}
          TF_PROD_ALERT_EMAIL:           ${{ secrets.TF_PROD_ALERT_EMAIL }}
          TF_PROD_ALERT_SMS:             ${{ secrets.TF_PROD_ALERT_SMS }}
          TF_PROD_PCO_CLIENT_ID:         ${{ secrets.TF_PROD_PCO_CLIENT_ID }}
          TF_PROD_PCO_CLIENT_SECRET:     ${{ secrets.TF_PROD_PCO_CLIENT_SECRET }}
          TF_PROD_PCO_API_APP_ID:        ${{ secrets.TF_PROD_PCO_API_APP_ID }}
          TF_PROD_PCO_API_SECRET:        ${{ secrets.TF_PROD_PCO_API_SECRET }}
          TF_PROD_PCO_CALLBACK_URL:      ${{ secrets.TF_PROD_PCO_CALLBACK_URL }}
          TF_PROD_PCO_TEAM_NAME:         ${{ secrets.TF_PROD_PCO_TEAM_NAME }}
          TF_PROD_ADMIN_WEB_URL:         ${{ secrets.TF_PROD_ADMIN_WEB_URL }}
          TF_PROD_JUDGE_WEB_URL:         ${{ secrets.TF_PROD_JUDGE_WEB_URL }}
          TF_PROD_WEBGUIDE_USERNAME:     ${{ secrets.TF_PROD_WEBGUIDE_USERNAME }}
          TF_PROD_WEBGUIDE_PASSWORD:     ${{ secrets.TF_PROD_WEBGUIDE_PASSWORD }}
          TF_PROD_CLOUDFRONT_CUSTOM_DOMAIN: ${{ secrets.TF_PROD_CLOUDFRONT_CUSTOM_DOMAIN }}
          TF_PROD_EMAIL_SMTP_USERNAME:   ${{ secrets.TF_PROD_EMAIL_SMTP_USERNAME }}
          TF_PROD_EMAIL_SMTP_PASSWORD:   ${{ secrets.TF_PROD_EMAIL_SMTP_PASSWORD }}
          TF_PROD_EMAIL_FROM_ADDRESS:    ${{ secrets.TF_PROD_EMAIL_FROM_ADDRESS }}
          TF_PROD_OWNER_PORTAL_URL:      ${{ secrets.TF_PROD_OWNER_PORTAL_URL }}
        run: |
          case "${{ inputs.environment }}" in
            test)
              cat > infra/terraform/test.tfvars << EOF
          region      = "$TF_TEST_REGION"
          project     = "$TF_TEST_PROJECT"
          environment = "$TF_TEST_ENVIRONMENT"
          domain      = "$TF_TEST_DOMAIN"
          db_username = "$TF_TEST_DB_USERNAME"
          route53_zone_id       = "$TF_TEST_ROUTE53_ZONE_ID"
          ecs_cpu               = "$TF_TEST_ECS_CPU"
          ecs_memory            = "$TF_TEST_ECS_MEMORY"
          ecs_min_size          = $TF_TEST_ECS_MIN_SIZE
          ecs_max_size          = $TF_TEST_ECS_MAX_SIZE
          rds_instance_class    = "$TF_TEST_RDS_INSTANCE_CLASS"
          rds_allocated_storage = $TF_TEST_RDS_ALLOCATED_STORAGE
          rds_backup_retention  = $TF_TEST_RDS_BACKUP_RETENTION
          enable_dev_login  = $TF_TEST_ENABLE_DEV_LOGIN
          run_seed          = $TF_TEST_RUN_SEED
          teardown_friendly = $TF_TEST_TEARDOWN_FRIENDLY
          image_tag         = "$TF_TEST_IMAGE_TAG"
          pco_client_id     = "$TF_TEST_PCO_CLIENT_ID"
          pco_client_secret = "$TF_TEST_PCO_CLIENT_SECRET"
          pco_api_app_id    = "$TF_TEST_PCO_API_APP_ID"
          pco_api_secret    = "$TF_TEST_PCO_API_SECRET"
          pco_callback_url  = "$TF_TEST_PCO_CALLBACK_URL"
          pco_team_name     = "$TF_TEST_PCO_TEAM_NAME"
          admin_web_url     = "$TF_TEST_ADMIN_WEB_URL"
          judge_web_url     = "$TF_TEST_JUDGE_WEB_URL"
          webguide_username   = "$TF_TEST_WEBGUIDE_USERNAME"
          webguide_password   = "$TF_TEST_WEBGUIDE_PASSWORD"
          email_smtp_username = "$TF_TEST_EMAIL_SMTP_USERNAME"
          email_smtp_password = "$TF_TEST_EMAIL_SMTP_PASSWORD"
          email_from_address  = "$TF_TEST_EMAIL_FROM_ADDRESS"
          owner_portal_url    = "$TF_TEST_OWNER_PORTAL_URL"
          EOF
              ;;
            perf)
              cat > infra/terraform/perf.tfvars << EOF
          region      = "$TF_PERF_REGION"
          project     = "$TF_PERF_PROJECT"
          environment = "$TF_PERF_ENVIRONMENT"
          domain      = "$TF_PERF_DOMAIN"
          db_username = "$TF_PERF_DB_USERNAME"
          route53_zone_id       = "$TF_PERF_ROUTE53_ZONE_ID"
          ecs_cpu               = "$TF_PERF_ECS_CPU"
          ecs_memory            = "$TF_PERF_ECS_MEMORY"
          ecs_min_size          = $TF_PERF_ECS_MIN_SIZE
          ecs_max_size          = $TF_PERF_ECS_MAX_SIZE
          rds_instance_class    = "$TF_PERF_RDS_INSTANCE_CLASS"
          rds_allocated_storage = $TF_PERF_RDS_ALLOCATED_STORAGE
          rds_backup_retention  = $TF_PERF_RDS_BACKUP_RETENTION
          db_connection_limit   = $TF_PERF_DB_CONNECTION_LIMIT
          skip_cloudfront          = $TF_PERF_SKIP_CLOUDFRONT
          cloudfront_custom_domain = $TF_PERF_CLOUDFRONT_CUSTOM_DOMAIN
          enable_dev_login  = $TF_PERF_ENABLE_DEV_LOGIN
          run_seed          = $TF_PERF_RUN_SEED
          teardown_friendly = $TF_PERF_TEARDOWN_FRIENDLY
          image_tag         = "$TF_PERF_IMAGE_TAG"
          pco_client_id     = "$TF_PERF_PCO_CLIENT_ID"
          pco_client_secret = "$TF_PERF_PCO_CLIENT_SECRET"
          pco_api_app_id    = "$TF_PERF_PCO_API_APP_ID"
          pco_api_secret    = "$TF_PERF_PCO_API_SECRET"
          pco_callback_url  = "$TF_PERF_PCO_CALLBACK_URL"
          pco_team_name     = "$TF_PERF_PCO_TEAM_NAME"
          admin_web_url     = "$TF_PERF_ADMIN_WEB_URL"
          judge_web_url     = "$TF_PERF_JUDGE_WEB_URL"
          webguide_username   = "$TF_PERF_WEBGUIDE_USERNAME"
          webguide_password   = "$TF_PERF_WEBGUIDE_PASSWORD"
          email_smtp_username = "$TF_PERF_EMAIL_SMTP_USERNAME"
          email_smtp_password = "$TF_PERF_EMAIL_SMTP_PASSWORD"
          email_from_address  = "$TF_PERF_EMAIL_FROM_ADDRESS"
          owner_portal_url    = "$TF_PERF_OWNER_PORTAL_URL"
          EOF
              ;;
            prod)
              cat > infra/terraform/prod.tfvars << EOF
          region      = "$TF_PROD_REGION"
          project     = "$TF_PROD_PROJECT"
          environment = "$TF_PROD_ENVIRONMENT"
          domain      = "$TF_PROD_DOMAIN"
          db_username = "$TF_PROD_DB_USERNAME"
          route53_zone_id       = "$TF_PROD_ROUTE53_ZONE_ID"
          ecs_cpu               = "$TF_PROD_ECS_CPU"
          ecs_memory            = "$TF_PROD_ECS_MEMORY"
          ecs_min_size          = $TF_PROD_ECS_MIN_SIZE
          ecs_max_size          = $TF_PROD_ECS_MAX_SIZE
          rds_instance_class    = "$TF_PROD_RDS_INSTANCE_CLASS"
          rds_allocated_storage = $TF_PROD_RDS_ALLOCATED_STORAGE
          rds_backup_retention  = $TF_PROD_RDS_BACKUP_RETENTION
          db_connection_limit   = $TF_PROD_DB_CONNECTION_LIMIT
          enable_dev_login  = $TF_PROD_ENABLE_DEV_LOGIN
          run_seed          = $TF_PROD_RUN_SEED
          teardown_friendly = $TF_PROD_TEARDOWN_FRIENDLY
          cors_allowed_origins     = "$TF_PROD_CORS_ALLOWED_ORIGINS"
          alert_email              = "$TF_PROD_ALERT_EMAIL"
          alert_sms                = "$TF_PROD_ALERT_SMS"
          cloudfront_custom_domain = $TF_PROD_CLOUDFRONT_CUSTOM_DOMAIN
          pco_client_id     = "$TF_PROD_PCO_CLIENT_ID"
          pco_client_secret = "$TF_PROD_PCO_CLIENT_SECRET"
          pco_api_app_id    = "$TF_PROD_PCO_API_APP_ID"
          pco_api_secret    = "$TF_PROD_PCO_API_SECRET"
          pco_callback_url  = "$TF_PROD_PCO_CALLBACK_URL"
          pco_team_name     = "$TF_PROD_PCO_TEAM_NAME"
          admin_web_url     = "$TF_PROD_ADMIN_WEB_URL"
          judge_web_url     = "$TF_PROD_JUDGE_WEB_URL"
          webguide_username   = "$TF_PROD_WEBGUIDE_USERNAME"
          webguide_password   = "$TF_PROD_WEBGUIDE_PASSWORD"
          email_smtp_username = "$TF_PROD_EMAIL_SMTP_USERNAME"
          email_smtp_password = "$TF_PROD_EMAIL_SMTP_PASSWORD"
          email_from_address  = "$TF_PROD_EMAIL_FROM_ADDRESS"
          owner_portal_url    = "$TF_PROD_OWNER_PORTAL_URL"
          EOF
              ;;
          esac

          # Inject the decommission flag into the generated tfvars (default false).
          # When true + action=apply, the backend is torn down (see decommission steps).
          echo "decommissioned = ${{ inputs.decommissioned }}" >> "infra/terraform/${{ inputs.environment }}.tfvars"

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current image tag (apply only)
        if: inputs.action == 'apply'
        id: image
        run: |
          TAG=$(aws ecs describe-task-definition \
            --task-definition "carshow-${{ inputs.environment }}-api" \
            --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text 2>/dev/null | awk -F: '{print $NF}')
          echo "tag=${TAG:-latest}" >> "$GITHUB_OUTPUT"

      # ── Decommission flow (action=apply + decommissioned=true) ───────────────
      # Runs terraform directly (not deploy.sh) to avoid the ECR-bootstrap path,
      # which assumes the backend resources still exist. Mirrors decommission.sh.
      - name: Decommission prep (RDS protection, empty SPA buckets + ECR)
        if: inputs.action == 'apply' && inputs.decommissioned
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          DB_ID="carshow-${ENVIRONMENT}"
          # Idempotent: the instance may already be deleted on a re-run.
          if aws rds describe-db-instances --db-instance-identifier "$DB_ID" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "Disabling RDS deletion protection on ${DB_ID}..."
            aws rds modify-db-instance --db-instance-identifier "$DB_ID" \
              --no-deletion-protection --apply-immediately --region "$AWS_REGION" >/dev/null
            aws rds wait db-instance-available --db-instance-identifier "$DB_ID" --region "$AWS_REGION"
          else
            echo "RDS ${DB_ID} already gone."
          fi
          # SPA buckets have force_destroy=false in prod, so empty them before destroy.
          for b in "carshow-admin-web-${ENVIRONMENT}" "carshow-judge-web-${ENVIRONMENT}"; do
            if aws s3 ls "s3://${b}" --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "Emptying s3://${b} ..."
              aws s3 rm "s3://${b}" --recursive --region "$AWS_REGION" >/dev/null
            else
              echo "Bucket ${b} already gone."
            fi
          done
          # ECR repo has force_delete=false in prod and can't be force-flagged while
          # being destroyed (count=0), so delete its images here first.
          REPO="carshow/api"
          if aws ecr describe-repositories --repository-names "$REPO" --region "$AWS_REGION" >/dev/null 2>&1; then
            IDS="$(aws ecr list-images --repository-name "$REPO" --region "$AWS_REGION" --query 'imageIds[*]' --output json)"
            if [ "$IDS" != "[]" ]; then
              echo "Deleting all images in ECR ${REPO} ..."
              aws ecr batch-delete-image --repository-name "$REPO" --region "$AWS_REGION" --image-ids "$IDS" >/dev/null
            else
              echo "ECR ${REPO} already empty."
            fi
          else
            echo "ECR ${REPO} already gone."
          fi

      - name: Terraform decommission apply
        if: inputs.action == 'apply' && inputs.decommissioned
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          terraform -chdir=infra/terraform init -input=false
          terraform -chdir=infra/terraform workspace select "$ENVIRONMENT"
          # Phase 1: reconfigure CloudFront to static-only FIRST and let it fully
          # deploy. Terraform's count/dynamic blocks don't reliably order the
          # distribution update before the CF function + cache-policy deletes, so
          # without this the deletes fail with FunctionInUse / CachePolicyInUse.
          terraform -chdir=infra/terraform apply \
            -var-file="${ENVIRONMENT}.tfvars" -var="image_tag=latest" -auto-approve \
            -target='aws_cloudfront_distribution.main[0]'
          # Phase 2: destroy everything else now that the functions + cache policy
          # are disassociated from the distribution.
          terraform -chdir=infra/terraform apply \
            -var-file="${ENVIRONMENT}.tfvars" \
            -var="image_tag=latest" \
            -auto-approve

      - name: Decommission finalize (sync static page + invalidate cache)
        if: inputs.action == 'apply' && inputs.decommissioned
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          PUBLIC_BUCKET="carshow-public-web-${ENVIRONMENT}"
          echo "Syncing static thank-you page to s3://${PUBLIC_BUCKET} ..."
          aws s3 sync infra/static-site/ "s3://${PUBLIC_BUCKET}/" --delete --region "$AWS_REGION"
          DIST_ID="$(terraform -chdir=infra/terraform output -raw cloudfront_distribution_id)"
          if [ -n "$DIST_ID" ]; then
            echo "Invalidating CloudFront ${DIST_ID} ..."
            aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*' >/dev/null
          fi
          echo "Decommission complete for ${ENVIRONMENT}."

      - name: Terraform apply (infra only — image and SPAs unchanged)
        if: inputs.action == 'apply' && !inputs.decommissioned
        run: |
          ./infra/deploy.sh \
            --env ${{ inputs.environment }} \
            --image-tag ${{ steps.image.outputs.tag }} \
            --skip-image \
            --skip-spas \
            --auto-approve

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        run: ./infra/deploy.sh --env ${{ inputs.environment }} --destroy --auto-approve

      - name: Suspend compute
        if: inputs.action == 'suspend'
        run: ./infra/deploy.sh --env ${{ inputs.environment }} --suspend --auto-approve

      - name: Resume compute
        if: inputs.action == 'resume'
        run: ./infra/deploy.sh --env ${{ inputs.environment }} --resume --auto-approve
