name: Terraform Apply

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [test, perf, prod]
      action:
        description: Action to perform
        required: true
        type: choice
        options: [apply, destroy, suspend, resume]

permissions:
  contents: read
  id-token: write

jobs:
  apply:
    name: ${{ inputs.action }} ${{ inputs.environment }}
    runs-on: [self-hosted, Linux, X64, carshow, deploy-test]
    environment: ${{ inputs.environment == 'prod' && 'infra-prod' || 'infra-nonprod' }}
    timeout-minutes: 60
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      AWS_REGION: ca-central-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Write tfvars from secret
        env:
          TEST_TFVARS: ${{ secrets.TEST_TFVARS }}
          PERF_TFVARS: ${{ secrets.PERF_TFVARS }}
          PROD_TFVARS: ${{ secrets.PROD_TFVARS }}
        run: |
          case "${{ inputs.environment }}" in
            test) printf '%s' "$TEST_TFVARS" > infra/terraform/test.tfvars ;;
            perf) printf '%s' "$PERF_TFVARS" > infra/terraform/perf.tfvars ;;
            prod) printf '%s' "$PROD_TFVARS" > infra/terraform/prod.tfvars ;;
          esac

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get current image tag (apply only)
        if: inputs.action == 'apply'
        id: image
        run: |
          TAG=$(aws ecs describe-task-definition \
            --task-definition "carshow-${{ inputs.environment }}-api" \
            --region "$AWS_REGION" \
            --query 'taskDefinition.containerDefinitions[0].image' \
            --output text 2>/dev/null | awk -F: '{print $NF}')
          echo "tag=${TAG:-latest}" >> "$GITHUB_OUTPUT"

      - name: Terraform apply (infra only — image and SPAs unchanged)
        if: inputs.action == 'apply'
        env:
          TF_VAR_webguide_username: ${{ secrets.WEBGUIDE_USERNAME }}
          TF_VAR_webguide_password: ${{ secrets.WEBGUIDE_PASSWORD }}
        run: |
          ./infra/deploy.sh \
            --env ${{ inputs.environment }} \
            --image-tag ${{ steps.image.outputs.tag }} \
            --skip-image \
            --skip-spas \
            --auto-approve

      - name: Terraform destroy
        if: inputs.action == 'destroy'
        env:
          TF_VAR_webguide_username: ${{ secrets.WEBGUIDE_USERNAME }}
          TF_VAR_webguide_password: ${{ secrets.WEBGUIDE_PASSWORD }}
        run: ./infra/deploy.sh --env ${{ inputs.environment }} --destroy --auto-approve

      - name: Suspend compute
        if: inputs.action == 'suspend'
        run: ./infra/deploy.sh --env ${{ inputs.environment }} --suspend --auto-approve

      - name: Resume compute
        if: inputs.action == 'resume'
        run: ./infra/deploy.sh --env ${{ inputs.environment }} --resume --auto-approve
