name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [test, perf, prod]

permissions:
  contents: read
  id-token: write

jobs:
  plan:
    name: Plan ${{ inputs.environment }}
    runs-on: [self-hosted, Linux, X64, carshow, deploy-test]
    environment: ${{ inputs.environment == 'prod' && 'infra-prod' || 'infra-nonprod' }}
    timeout-minutes: 20
    concurrency:
      group: terraform-${{ inputs.environment }}
      cancel-in-progress: false

    env:
      AWS_REGION: ca-central-1
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Write tfvars from secret
        env:
          TEST_TFVARS: ${{ secrets.TEST_TFVARS }}
          PERF_TFVARS: ${{ secrets.PERF_TFVARS }}
          PROD_TFVARS: ${{ secrets.PROD_TFVARS }}
        run: |
          case "${{ inputs.environment }}" in
            test) printf '%s' "$TEST_TFVARS" > infra/terraform/test.tfvars ;;
            perf) printf '%s' "$PERF_TFVARS" > infra/terraform/perf.tfvars ;;
            prod) printf '%s' "$PROD_TFVARS" > infra/terraform/prod.tfvars ;;
          esac

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform plan
        env:
          TF_VAR_webguide_username: ${{ secrets.WEBGUIDE_USERNAME }}
          TF_VAR_webguide_password: ${{ secrets.WEBGUIDE_PASSWORD }}
        run: ./infra/deploy.sh --env ${{ inputs.environment }} --plan --auto-approve
