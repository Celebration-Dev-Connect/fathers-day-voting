services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carshow
      POSTGRES_PASSWORD: carshow
      POSTGRES_DB: carshow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carshow -d carshow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://carshow:carshow@postgres:5432/carshow?schema=public
      API_PORT: 4000
      API_HOST: 0.0.0.0
      JWT_SECRET: local-proxmox-dev-secret-change-me
      NODE_ENV: development
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: sh -c "cd packages/db && npx prisma migrate deploy && npm run db:seed --workspace @carshow/db"
    environment:
      DATABASE_URL: postgresql://carshow:carshow@postgres:5432/carshow?schema=public
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy

  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres-data:
