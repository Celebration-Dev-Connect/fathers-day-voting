<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Father's Day Car Show 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Montserrat", system-ui, sans-serif;
      background: #191c21;
      color: #f9fafb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
    }

    .logo {
      width: min(280px, 80%);
      height: auto;
      margin: 0 auto 2rem;
      display: block;
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255 255 255 / 12%);
      margin: 1.75rem 0;
    }

    h1 {
      font-size: clamp(1.75rem, 6vw, 2.5rem);
      font-weight: 900;
      line-height: 1.1;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: #ffffff;
      margin-bottom: 1rem;
    }

    h1 span {
      color: #b90a29;
    }

    .subtitle {
      font-size: 1rem;
      font-weight: 600;
      color: rgba(255 255 255 / 55%);
      line-height: 1.6;
      margin-bottom: 0;
    }

    .see-you {
      font-size: 1.125rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #ffffff;
      margin-bottom: 1.75rem;
    }

    .church-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #b90a29;
      color: #ffffff;
      text-decoration: none;
      padding: 0.875rem 1.75rem;
      border-radius: 4px;
      font-size: 0.875rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      transition: background 0.15s;
    }

    .church-link:hover {
      background: #cb1836;
    }

    .church-link svg {
      width: 1rem;
      height: 1rem;
      flex-shrink: 0;
    }

    footer {
      margin-top: 2.5rem;
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255 255 255 / 28%);
    }
  </style>
</head>

<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="Edmonton Father's Day Car Show" />

    <h1>Thanks for<br /><span>Coming!</span></h1>

    <p class="subtitle">
      The 2026 Father's Day Car Show is a wrap! <br /><br />
      We are so grateful for each of you who joined us to celebrate
      the fathers in your life. What a beautiful day of community and celebration.
    </p>

    <hr class="divider" />

    <p class="see-you">See you next year!</p>

    <a class="church-link" href="https://www.celebrationedmonton.com" target="_blank" rel="noopener noreferrer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path fill-rule="evenodd"
          d="M4.25 5.5a.75.75 0 0 0-.75.75v8.5c0 .414.336.75.75.75h8.5a.75.75 0 0 0 .75-.75v-4a.75.75 0 0 1 1.5 0v4A2.25 2.25 0 0 1 12.75 17h-8.5A2.25 2.25 0 0 1 2 14.75v-8.5A2.25 2.25 0 0 1 4.25 4h5a.75.75 0 0 1 0 1.5h-5Z"
          clip-rule="evenodd" />
        <path fill-rule="evenodd"
          d="M6.194 12.753a.75.75 0 0 0 1.06.053L16.5 4.44v2.81a.75.75 0 0 0 1.5 0v-4.5a.75.75 0 0 0-.75-.75h-4.5a.75.75 0 0 0 0 1.5h2.553l-9.056 8.194a.75.75 0 0 0-.053 1.06Z"
          clip-rule="evenodd" />
      </svg>
      Visit Celebration Church
    </a>

    <footer>Hosted by Celebration Church &mdash; Edmonton, AB</footer>
  </div>
</body>

</html>
